# 由 warp draft 依側錄紀錄產生的宣告初稿。
# 請逐條收緊、填寫每條授權的 purpose（一句人話），再執行 warp lint。
# ⚠ app.entry 取自最後一次側錄的指令（含參數），app.kind 暫填 cli：請確認或改正。
warp: "0.1"
app:
  name: photo-renamer
  display_name: 照片依拍攝時間改名
  version: 0.1.0
  kind: cli
  entry:
    - .venv/bin/python
    - -m
    - photo_renamer
    - rename
    - ${USER_PICK:photos}
  digest: sha256:5ec2751aad611fd5cb707a699a4607e438f02341b07f89f3603810b4371d666b
runtime:
  isolation: process
  resources:
    cpu: 1
    memory: 512Mi
    pids: 128
    disk: 1Gi
  spawn: none
  background: false
files:
  - path: ${USER_PICK:photos}
    mode: rw
    purpose: 讀取你選定資料夾裡的照片並在原地改名，同時在該資料夾內留下可復原的改名紀錄
exceptions: []
evidence:
  - grant: files[0]
    observed_in: .warp/evidence/trace-0004.json
    triggered_by: .venv/bin/python -m photo_renamer rename -y '${USER_PICK:photos}'
