# Shared settings for up.sh / down.sh / env.sh / bin/mockrun (bash).
MOCK_IP=192.88.99.10        # upstream address (deprecated 6to4-relay anycast block, RFC 7526; "public" to warp's netpolicy)
HOST_IP=192.88.99.1         # host side of the veth
NS_FILE=/run/netns/mocknet  # persistent network namespace of the server
HOST_IF=mnet0
PEER_IF=mnet1
# Names that are put into the system /etc/hosts (safe to override machine-wide).
SYS_HOSTS="geocoding-api.open-meteo.com api.open-meteo.com v6.exchangerate-api.com example.com www.example.com docs.example.org broken.example.net slow.example.net redirect.example.net"
# Names that are NEVER put into the system /etc/hosts: Claude Code on this
# machine talks to the real api.anthropic.com. Only the warp gate
# (WARP_HOSTS_FILE) and bin/mockrun (private mount namespace) see these.
PRIVATE_HOSTS="api.anthropic.com"
HOSTS_MARK_BEGIN="# >>> mocknet trial (managed by mocknet/up.sh; removed by down.sh) >>>"
HOSTS_MARK_END="# <<< mocknet trial <<<"
CA_SYS_FILE=/usr/local/share/ca-certificates/mocknet-trial-ca.crt
CERTIFI_MARK_BEGIN="# >>> mocknet-trial-ca >>>"
CERTIFI_MARK_END="# <<< mocknet-trial-ca <<<"
# Copy of the node binary placed under /usr so that it exists inside the warp shell.
NODE_COPY=/usr/local/lib/mocknet-trial/node
NODE_LINK=/usr/local/sbin/node
